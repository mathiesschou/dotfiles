# Aerospace config — Niri-inspireret
# Modifier: Alt (svarer til Super/Logo på Linux)

start-at-login = true
after-login-command = []
after-startup-command = []

# Flyt musen til midten af det fokuserede vindue hver gang fokus skifter
on-focus-changed = ['move-mouse window-force-center']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Fast fordeling: 1-5 på den indbyggede skærm, 6-9 på den eksterne.
# (Når den eksterne ikke er tilkoblet, falder 6-9 tilbage på main.)
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'

[gaps]
inner.horizontal = 16
inner.vertical   = 16
outer.left       = 16
outer.bottom     = 16
outer.top        = 16
outer.right      = 16

# ── Keybindings ────────────────────────────────────────────────

[mode.main.binding]

# Navigation (hjkl — som i Niri)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Flyt vinduer
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Layout: tiles (horisontal, som Niri's kolonner) eller accordion
alt-t = 'layout tiles horizontal vertical'
alt-w = 'layout accordion horizontal vertical'

# Fullscreen
alt-f = 'fullscreen'

# Float / tile toggle
alt-shift-space = 'layout floating tiling'

# Luk vindue
alt-q = 'close'

# Workspaces (1–9)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Flyt vindue til workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Skift mellem forrige/næste workspace
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Fokuser forrige/næste skærm
alt-n = 'focus-monitor --wrap-around prev'
alt-m = 'focus-monitor --wrap-around next'

# Flyt det aktive vindue til forrige/næste skærm (og følg med fokus)
alt-shift-n = 'move-node-to-monitor --wrap-around --focus-follows-window prev'
alt-shift-m = 'move-node-to-monitor --wrap-around --focus-follows-window next'

# Reload config
alt-shift-c = 'reload-config'

# Skift til service mode (til fejlsøgning)
alt-shift-semicolon = 'mode service'

# ── Tmux sessionizer ──────────────────────────────────────────

alt-space = "exec-and-forget /Users/mathies/.local/bin/tmux-sessionizer"

# ── App-regler (workspace-tildelinger) ────────────────────────

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.window-title-regex-substring = 'tmux-picker'
run = ['layout floating', 'resize width 800', 'resize height 400']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'net.shinyfrog.bear'
run = 'move-node-to-workspace 4'

# Alle Finder-vinduer skal floate
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# ── Service mode ───────────────────────────────────────────────

[mode.service.binding]
esc              = 'mode main'
r                = ['flatten-workspace-tree', 'mode main']
f                = ['layout floating tiling', 'mode main']
backspace        = ['close-all-windows-but-current', 'mode main']
alt-shift-h      = ['join-with left',  'mode main']
alt-shift-j      = ['join-with down',  'mode main']
alt-shift-k      = ['join-with up',    'mode main']
alt-shift-l      = ['join-with right', 'mode main']
