# ~/.config/tmux/tmux.conf — sensible defaults, no plugins.

# True color + italics
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # renumber when a window closes

# Mouse on
set -g mouse on

# Faster key response, bigger history
set -sg escape-time 10
set -g history-limit 50000

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Split panes with | / % and - (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'

# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation — vim-tmux-navigator (Ctrl-h/j/k/l, seamless med nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes with prefix + Shift-H/J/K/L (repeatable)
bind -n M-Left  resize-pane -L 5
bind -n M-Down  resize-pane -D 5
bind -n M-Up    resize-pane -U 5
bind -n M-Right resize-pane -R 5

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Statusbar ──────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=default,fg=#6c7086"
set -g status-left ""
set -g status-right ""

set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-current-style "fg=#cdd6f4,bold"
set -g window-status-style "fg=#6c7086"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cc4444"
